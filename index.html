<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动打卡系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .checkin-form {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #34d399;
            color: white;
        }

        .btn-secondary:hover {
            background: #10b981;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .admin-section {
            display: none;
        }

        .admin-section.active {
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #34d399;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }

        .message.warning {
            background: #fef3c7;
            color: #92400e;
            border: 2px solid #f59e0b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #f3f4f6;
            font-weight: 600;
            color: #374151;
        }

        tr:hover {
            background: #f9fafb;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .toggle-btn {
            background: #f3f4f6;
            color: #374151;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .toggle-btn:hover {
            background: #e5e7eb;
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 打卡界面 -->
        <div class="card" id="checkinSection">
            <h1>📋 活动签到</h1>
            
            <div id="messageBox"></div>
            
            <form class="checkin-form" id="checkinForm">
                <div class="form-group">
                    <label for="name">姓名 *</label>
                    <input type="text" id="name" placeholder="请输入您的姓名" required>
                </div>
                
                <div class="form-group">
                    <label for="day">活动日期 *</label>
                    <select id="day" required>
                        <option value="">请选择</option>
                        <option value="day1">第一天</option>
                        <option value="day2">第二天</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary">✓ 签到打卡</button>
            </form>

            <button class="toggle-btn" onclick="toggleAdmin()">管理员入口 →</button>
        </div>

        <!-- 管理员界面 -->
        <div class="card admin-section" id="adminSection">
            <h1>🎯 管理后台</h1>
            
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">总打卡次数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="uniqueCount">0</div>
                    <div class="stat-label">参与人数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="certificateCount">0</div>
                    <div class="stat-label">符合证书条件</div>
                </div>
            </div>

            <button class="btn btn-secondary" onclick="exportToExcel()">📥 导出全部数据 (Excel)</button>
            <button class="btn btn-primary" onclick="exportCertificateList()">🏆 导出证书名单 (Excel)</button>
            <button class="btn btn-danger" onclick="clearAllData()">🗑️ 清空所有数据</button>
            <button class="toggle-btn" onclick="toggleAdmin()">← 返回打卡界面</button>

            <div style="overflow-x: auto;">
                <table id="recordTable">
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>第一天</th>
                            <th>第二天</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        // 数据存储
        let checkinData = JSON.parse(localStorage.getItem('checkinData')) || {};

        // 显示消息
        function showMessage(message, type) {
            const messageBox = document.getElementById('messageBox');
            messageBox.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                messageBox.innerHTML = '';
            }, 5000);
        }

        // 打卡提交
        document.getElementById('checkinForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const day = document.getElementById('day').value;
            
            if (!name || !day) {
                showMessage('请填写所有必填项', 'error');
                return;
            }

            // 初始化用户数据
            if (!checkinData[name]) {
                checkinData[name] = {
                    name: name,
                    day1: null,
                    day2: null
                };
            }

            // 检查是否已经打卡
            if (checkinData[name][day]) {
                showMessage(`${name}，您今天已经签到过了！`, 'warning');
                return;
            }

            // 记录打卡时间
            const now = new Date();
            const timestamp = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            checkinData[name][day] = timestamp;
            
            // 保存到localStorage
            localStorage.setItem('checkinData', JSON.stringify(checkinData));
            
            showMessage(`✓ ${name}，签到成功！`, 'success');
            
            // 清空表单
            document.getElementById('name').value = '';
            document.getElementById('day').value = '';
            
            // 更新统计
            updateStats();
        });

        // 切换管理员界面
        function toggleAdmin() {
            const checkinSection = document.getElementById('checkinSection');
            const adminSection = document.getElementById('adminSection');
            
            if (adminSection.classList.contains('active')) {
                adminSection.classList.remove('active');
                checkinSection.style.display = 'block';
            } else {
                adminSection.classList.add('active');
                checkinSection.style.display = 'none';
                updateStats();
                updateTable();
            }
        }

        // 更新统计数据
        function updateStats() {
            const names = Object.keys(checkinData);
            const totalCheckins = names.reduce((sum, name) => {
                return sum + (checkinData[name].day1 ? 1 : 0) + (checkinData[name].day2 ? 1 : 0);
            }, 0);
            
            const certificateEligible = names.filter(name => {
                return checkinData[name].day1 && checkinData[name].day2;
            }).length;

            document.getElementById('totalCount').textContent = totalCheckins;
            document.getElementById('uniqueCount').textContent = names.length;
            document.getElementById('certificateCount').textContent = certificateEligible;
        }

        // 更新表格
        function updateTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            Object.values(checkinData).forEach(record => {
                const bothDays = record.day1 && record.day2;
                const row = tbody.insertRow();
                
                row.innerHTML = `
                    <td><strong>${record.name}</strong></td>
                    <td>${record.day1 || '-'}</td>
                    <td>${record.day2 || '-'}</td>
                    <td>
                        <span class="badge ${bothDays ? 'badge-success' : 'badge-warning'}">
                            ${bothDays ? '✓ 符合证书条件' : '未完成'}
                        </span>
                    </td>
                `;
            });
        }

        // 导出所有数据到Excel
        function exportToExcel() {
            if (Object.keys(checkinData).length === 0) {
                alert('没有数据可导出');
                return;
            }

            const data = Object.values(checkinData).map(record => ({
                '姓名': record.name,
                '第一天打卡时间': record.day1 || '未打卡',
                '第二天打卡时间': record.day2 || '未打卡',
                '是否符合证书条件': (record.day1 && record.day2) ? '是' : '否'
            }));

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "打卡记录");
            
            const fileName = `活动打卡记录_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.xlsx`;
            XLSX.writeFile(wb, fileName);
            
            showMessage('✓ Excel文件已导出', 'success');
        }

        // 导出证书名单
        function exportCertificateList() {
            const eligible = Object.values(checkinData).filter(record => 
                record.day1 && record.day2
            );

            if (eligible.length === 0) {
                alert('暂无符合证书条件的会员');
                return;
            }

            const data = eligible.map((record, index) => ({
                '序号': index + 1,
                '姓名': record.name,
                '第一天打卡时间': record.day1,
                '第二天打卡时间': record.day2
            }));

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "证书名单");
            
            const fileName = `证书名单_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.xlsx`;
            XLSX.writeFile(wb, fileName);
            
            alert(`已导出 ${eligible.length} 位符合条件的会员名单`);
        }

        // 清空所有数据
        function clearAllData() {
            if (confirm('确定要清空所有打卡数据吗？此操作不可恢复！')) {
                if (confirm('再次确认：真的要删除所有数据吗？')) {
                    checkinData = {};
                    localStorage.removeItem('checkinData');
                    updateStats();
                    updateTable();
                    alert('所有数据已清空');
                }
            }
        }

        // 页面加载时更新统计
        window.addEventListener('load', function() {
            updateStats();
        });
    </script>
</body>
</html>
