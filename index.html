<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动打卡系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #34d399;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }

        .message.warning {
            background: #fef3c7;
            color: #92400e;
            border: 2px solid #f59e0b;
        }

        .loading {
            text-align: center;
            color: #667eea;
            margin-top: 10px;
        }

        .info-box {
            background: #f0f9ff;
            border: 2px solid #0ea5e9;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9em;
            color: #075985;
        }

        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📋 活动签到</h1>
            <div class="subtitle">数据实时同步到云端</div>
            
            <div id="messageBox" class="message"></div>
            
            <form id="checkinForm">
                <div class="form-group">
                    <label for="name">姓名 *</label>
                    <input type="text" id="name" placeholder="请输入您的姓名" required>
                </div>
                
                <div class="form-group">
                    <label for="day">活动日期 *</label>
                    <select id="day" required>
                        <option value="">请选择</option>
                        <option value="第一天">第一天</option>
                        <option value="第二天">第二天</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    ✓ 签到打卡
                </button>
                
                <div id="loadingText" class="loading" style="display: none;">
                    正在提交...
                </div>
            </form>

            <div class="info-box">
                <strong>💡 提示：</strong>
                打卡数据会实时保存到云端，两天都打卡的会员将自动获得证书资格。
            </div>
        </div>
    </div>

    <script>
        // Google Apps Script Web App URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyiZBY2HoivkZaeFflcjZRJlIvhhqsL-TawPhRBKHwbWuHJ1v193a_cSWynvm_Hza9C/exec';

        const form = document.getElementById('checkinForm');
        const messageBox = document.getElementById('messageBox');
        const submitBtn = document.getElementById('submitBtn');
        const loadingText = document.getElementById('loadingText');

        // 显示消息
        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.className = `message ${type} show`;
            
            setTimeout(() => {
                messageBox.classList.remove('show');
            }, 5000);
        }

        // 表单提交
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const day = document.getElementById('day').value;
            
            if (!name || !day) {
                showMessage('请填写所有必填项', 'error');
                return;
            }

            // 检查是否配置了Google Script URL
            if (SCRIPT_URL === 'YOUR_GOOGLE_SCRIPT_URL_HERE') {
                showMessage('⚠️ 系统未配置，请联系管理员', 'error');
                return;
            }

            // 禁用按钮，显示加载状态
            submitBtn.disabled = true;
            loadingText.style.display = 'block';

            try {
                const timestamp = new Date().toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                const formData = new FormData();
                formData.append('name', name);
                formData.append('day', day);
                formData.append('timestamp', timestamp);

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.status === 'success') {
                    showMessage(`✓ ${name}，签到成功！`, 'success');
                    document.getElementById('name').value = '';
                    document.getElementById('day').value = '';
                } else if (result.status === 'duplicate') {
                    showMessage(`${name}，您今天已经签到过了！`, 'warning');
                } else {
                    showMessage('签到失败，请重试', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('网络错误，请检查网络连接', 'error');
            } finally {
                submitBtn.disabled = false;
                loadingText.style.display = 'none';
            }
        });
    </script>
</body>
</html>
